name: Docker 镜像发布

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 发布到 GHCR；关闭时仅构建
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  reject-publish-ref:
    name: 拒绝越界的手动发布
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish == true &&
      github.ref != 'refs/heads/main' && startsWith(github.ref, 'refs/tags/v') == false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: 报告不允许发布的 ref
        run: |
          echo "::error::手动发布仅允许 main 分支或 v* 标签。"
          exit 1

  build:
    name: 仅构建镜像
    if: github.event_name == 'workflow_dispatch' && inputs.publish == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: 构建但不推送
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=cfst-web
          cache-to: type=gha,mode=max,scope=cfst-web

  build-and-push:
    name: 构建并发布到 GHCR
    if: >-
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)) &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-image-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=long,prefix=sha-

      - name: 构建并推送镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cfst-web
          cache-to: type=gha,mode=max,scope=cfst-web
