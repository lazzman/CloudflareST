name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  platform-tests:
    name: 平台测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: 代码规范检查
        run: go vet ./...

      - name: 单元与平台回环测试
        if: runner.os == 'Windows'
        run: go test ./... -count=1 -timeout 180s

      - name: 单元、平台回环与竞态测试
        if: runner.os != 'Windows'
        run: go test -race ./... -count=1 -timeout 180s

  linux-icmp-fallback:
    name: Linux 非特权 ICMP 后备路径
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 无 NET_RAW 时强制测试 ping socket
        run: |
          docker run --rm \
            --cap-drop=NET_RAW \
            --sysctl net.ipv4.ping_group_range="0 2147483647" \
            -e CFST_REQUIRE_ICMP_BACKEND=datagram \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            golang:1.26.10 \
            go test ./task -run TestICMPSocketLiveLoopback -v -count=1 -timeout=90s

  tests-32bit:
    name: 32 位测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GOARCH: '386'
      CGO_ENABLED: '0'
      CFST_SKIP_ICMP_LIVE: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 设置 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: 执行 32 位单元测试
        run: go test ./... -count=1 -timeout 180s

  cross-build:
    name: 发行架构编译 (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.x', 'stable']
    env:
      CGO_ENABLED: '0'
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 设置 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: 编译发行架构与平台测试
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/386 linux/arm64 linux/arm/5 linux/arm/6 linux/arm/7 linux/mips linux/mipsle linux/mips64 linux/mips64le windows/amd64 windows/386 windows/arm64 darwin/amd64 darwin/arm64; do
            IFS=/ read -r GOOS GOARCH GOARM <<< "$target"
            export GOOS GOARCH GOARM
            echo "编译 $target"
            go build -o "$RUNNER_TEMP/cfst" .
            go test -c -o "$RUNNER_TEMP/cfst.test" ./task
          done

  test:
    name: 基础测试与构建验证
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: 代码规范检查
        run: go vet ./...

      - name: 单元测试
        run: go test ./...

      - name: 编译验证（amd64）
        run: go build -trimpath -ldflags="-s -w" -o cfst .
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'

      - name: 编译验证（Windows）
        run: go build -trimpath -ldflags="-s -w" -o cfst.exe .
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'

  # goroutineleak 检测（实验性，需要 Go 1.26+）
  goroutineleak:
    name: Goroutine 泄漏检测
    runs-on: ubuntu-latest
    continue-on-error: true # 实验性功能，不阻塞 CI
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Go 环境（需要 1.26+ 支持 goroutineleakprofile）
        uses: actions/setup-go@v6
        with:
          go-version: 'stable' # 当前 stable 为 1.26.x，支持 goroutineleakprofile

      - name: 使用 GOEXPERIMENT=goroutineleakprofile 编译并运行
        run: |
          GOEXPERIMENT=goroutineleakprofile go build -trimpath -o cfst_test .
          # 运行一次简单的测速，结束后检查 goroutineleak profile
          ./cfst_test -f ip.txt -t 1 -dn 1 -dd -timeout 30 || true
          # 如果存在 goroutineleak profile，输出统计信息
          if ls goroutineleak* 1> /dev/null 2>&1; then
            echo "=== Goroutine Leak Profile ==="
            go tool pprof -top goroutineleak*
          else
            echo "未发现 goroutineleak profile 文件（可能无泄漏或 Go 版本不支持）"
          fi
        env:
          CGO_ENABLED: '0'
